# 与本机 make check / make test 相同的检查；另核对接口契约与前端生成代码一致（make gen 后没有差异）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: 后端（ruff + pytest）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # hdip_owner 是超级用户（同 docker-compose），测试由它建 hdip_test 并跑迁移
      db:
        image: postgres:18
        env:
          POSTGRES_DB: hdip
          POSTGRES_USER: hdip_owner
          POSTGRES_PASSWORD: hdip_owner
          TZ: Asia/Shanghai
          PGTZ: Asia/Shanghai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hdip_owner -d hdip"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HDIP_DATABASE_URL: postgresql+psycopg://hdip_app:hdip_app@localhost:5432/hdip
      HDIP_MIGRATION_DATABASE_URL: postgresql+psycopg://hdip_owner:hdip_owner@localhost:5432/hdip
      HDIP_TIMEZONE: Asia/Shanghai
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - name: 建应用账号 hdip_app（同 db/init/01-roles.sql）
        run: psql -v ON_ERROR_STOP=1 -c "CREATE ROLE hdip_app LOGIN PASSWORD 'hdip_app'"
        env:
          PGHOST: localhost
          PGUSER: hdip_owner
          PGPASSWORD: hdip_owner
          PGDATABASE: hdip
      - run: uv run ruff check . ../migrations
      - run: uv run ruff format --check . ../migrations
      - run: uv run pytest -q
      - name: 接口契约与 web/openapi.json 一致
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- ../web/openapi.json || { echo "接口变了：执行 make gen 并提交"; exit 1; }

  web:
    name: 前端（类型检查 + 生成代码）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: 生成的 hooks 与 web/openapi.json 一致
        run: |
          npm run gen:api
          test -z "$(git status --porcelain -- src/api/generated)" || { git status --short -- src/api/generated; exit 1; }
