services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hdip
      POSTGRES_USER: hdip_owner
      POSTGRES_PASSWORD: hdip_owner
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - hdip-pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  hdip-pg:
