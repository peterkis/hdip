[alembic]
script_location = %(here)s/../migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os
# 连接串在 migrations/env.py 中从 HDIP_MIGRATION_DATABASE_URL 读取，这里不写。

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
